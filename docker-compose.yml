services:
  api:
    build: .
    # entrypoint: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Mount application code for live reloading
      - ./app:/project/app
      - ./logs:/project/logs
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Maximum 50% of a single CPU core
          memory: 512M     # Maximum 512 Megabytes of RAM
        reservations:
          cpus: '0.25'     # Guaranteed minimum 25% of a core
          memory: 256M     # Guaranteed minimum 256 Megabytes of RAM
